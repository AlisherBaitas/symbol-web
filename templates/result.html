<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Результат — Symbol Art Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="page result-page">
    <div class="result-card card terminal">

      <div class="terminal-header">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">output.txt</div>
        <div class="terminal-actions">
          <button type="button" id="copy-result-btn" class="btn-copy">Copy</button>
        </div>
      </div>

      <div class="result-summary">
        <span>текст: <strong>{{.Text}}</strong></span>
        <span>баннер: <strong>{{.Banner}}</strong></span>
      </div>

      <div class="terminal-body">
        <pre class="ascii-output">{{.Result}}</pre>
      </div>

      <div class="output-meta">
        <a href="/">← сгенерировать ещё</a>
        <span>symbol-web</span>
      </div>

    </div>
  </div>
</body>
</html>

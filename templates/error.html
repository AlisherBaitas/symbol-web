<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">

  <title>Ошибка {{.Code}} — Symbol Studio</title>

  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
  <header class="site-header wrap">
    <a class="brand" href="/" aria-label="Symbol Studio — главная">
      <span class="brand-icon" aria-hidden="true">S<span>_</span></span>
      <span>symbol<span class="brand-light">studio</span><span class="brand-dot">.</span></span>
    </a>
  </header>

  <main class="wrap">
    <section class="error-page" aria-labelledby="error-title">
      <p class="eyebrow">ОШИБКА {{.Code}} · {{.Title}}</p>

      <h1 id="error-title">Не получилось создать надпись</h1>

      <p class="error-message" role="alert">{{.Message}}</p>

      <a class="button button-primary" href="/">Вернуться к генератору</a>
    </section>
  </main>

  <footer class="site-footer wrap">
    <span>
      symbolstudio.
      <span class="footer-muted">Сделано из символов.</span>
    </span>

    <span>asamat · abaitas · ysoltamb</span>
  </footer>
</body>
</html>

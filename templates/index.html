<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Art Generator</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- [Suggestions] Подключение скриптов: подсказки при вводе и творческие идеи -->
  <script src="/static/js/suggestions.js" defer></script>
  <script src="/static/js/variations.js" defer></script>
</head>
<body>

  <h1 class="main-text">ASCII Art Generator</h1>

  <div class="input-container">
    <form action="/symbol-art" method="POST">

      <!-- [Suggestions] Обёртка поля ввода: к ней привязан выпадающий список подсказок.
           Список #suggestions-dropdown заполняет static/js/suggestions.js -->
      <div class="input-wrapper">
        <input type="text" name="inputWord" placeholder="Text to ASCII art" autocomplete="off" required>
        <div id="suggestions-dropdown" class="suggestions hidden"></div>
      </div>
      <button type="submit">Draw</button>

        <label for="banners">Choose a banner:</label>

        <select name="banners" id="banners">
          <option value="standard.txt">Standard</option>
          <option value="shadow.txt">Shadow</option>
          <option value="thinkertoy.txt">Thinkertoy</option>
        </select>

    </form>
  </div>

  <div class="ai-btns-container">

    <button id="ai-recommend-btn" class="btn-ai">🤖 AI Recommend Banner</button>
    <div id="recommendation-result" class="hidden"></div>

    <button id="get-variations-btn" class="btn-secondary">💡 Get Creative Ideas</button>
    <div id="variations-modal" class="modal hidden"></div>  
      
  </div>



</body>
</html>
